name: sync-upstream

on:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Sync DeepSeek Harness payload
        run: node scripts/update-dsh.mjs

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          title: 'chore: 同步 DeepSeek Harness 载荷'
          branch: sync/dsh-payload
          commit-message: 'chore: 同步 @deepseek-ai/dsh 到最新版本'
          body: |
            Automated upstream sync: `@deepseek-ai/dsh` bumped to its latest npm
            release. The compatible `@deepseek-ai/dsh-web-frontend` version is
            resolved from `dsh-web-app` and validated by the payload CI matrix.

            Merging does NOT publish artifacts — cut a `v*` tag afterwards to
            trigger `release.yml` for all platforms.
