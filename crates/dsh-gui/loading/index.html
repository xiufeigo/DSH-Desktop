<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
        background: transparent;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
        color: #202124;
        user-select: none;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .mark {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(32, 33, 36, 0.18);
        border-top-color: #137c6b;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #646a73;
        font-size: 13px;
        letter-spacing: 0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #f2f3f5;
        }

        .mark {
          border-color: rgba(242, 243, 245, 0.18);
          border-top-color: #3db8a4;
        }

        p {
          color: #aeb4bd;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark {
          animation: none;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div class="mark" aria-hidden="true"></div>
      <h1>DSH Desktop</h1>
      <p>Starting...</p>
    </main>
  </body>
</html>
